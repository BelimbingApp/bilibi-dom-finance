# Example-only fixture of the Finance Domain: the ledger records the slice
# proofs act on, created through the facade in a disposable database. Never a
# product dependency; `ledger`'s dev-dependency makes it a workspace member.
[package]
name = "bilibi-finance-walkthrough-fixture"
default-run = "bilibi-finance-walkthrough-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bilibi-authz.workspace = true
bilibi-base.workspace = true
bilibi-core.workspace = true
bilibi-database.workspace = true
bilibi-domains.workspace = true
bilibi-extensions.workspace = true
bilibi-company.workspace = true
bilibi-finance-attachments = { path = "../../attachments" }
bilibi-finance-payables = { path = "../../payables" }
bilibi-finance-einvoice = { path = "../../einvoice" }
bilibi-finance-fixed-assets = { path = "../../fixed_assets" }
bilibi-finance-ledger = { path = "../../ledger" }
bilibi-finance-payroll = { path = "../../payroll" }
bilibi-finance-receivables = { path = "../../receivables" }
bilibi-module-registry.workspace = true
bilibi-party-ids.workspace = true
bilibi-queue.workspace = true
bilibi-settings.workspace = true
bilibi-tenancy.workspace = true
bilibi-ui.workspace = true
