# Example-only fixture of the Finance Domain: the ledger records the slice
# proofs act on, created through the facade in a disposable database. Never a
# product dependency; `ledger`'s dev-dependency makes it a workspace member.
[package]
name = "bilibi-finance-walkthrough-fixture"
default-run = "bilibi-finance-walkthrough-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bilibi-finance-walkthrough-fixture"
path = "src/main.rs"

[[bin]]
name = "bilibi-finance-walkthrough-ui"
path = "src/ui.rs"

[dependencies]
bilibi-authz.workspace = true
bilibi-base.workspace = true
bilibi-core.workspace = true
bilibi-database.workspace = true
bilibi-domains.workspace = true
bilibi-extensions.workspace = true
bilibi-company.workspace = true
bilibi-address.workspace = true
bilibi-party.workspace = true
bilibi-finance-attachments = { path = "../../attachments" }
bilibi-finance-payables = { path = "../../payables" }
bilibi-finance-einvoice = { path = "../../einvoice" }
bilibi-finance-fixed-assets = { path = "../../fixed_assets" }
bilibi-finance-ledger = { path = "../../ledger" }
bilibi-finance-payroll = { path = "../../payroll" }
bilibi-finance-receivables = { path = "../../receivables" }
bilibi-finance-reconciliation = { path = "../../reconciliation" }
bilibi-finance-reports = { path = "../../reports" }
bilibi-module-registry.workspace = true
bilibi-party-ids.workspace = true
bilibi-queue.workspace = true
bilibi-settings.workspace = true
bilibi-tenancy.workspace = true
bilibi-ui.workspace = true
bilibi-web = { path = "../../../../web" }
bilibi-walkthrough-fixture = { path = "../../../../../fixtures/walkthrough" }
axum.workspace = true
inventory.workspace = true
jiff = "0.2.38"
rust_decimal.workspace = true
serde_json.workspace = true
tokio-postgres.workspace = true
tokio.workspace = true

# The e-invoice clearance section's stand-in authority.
base64 = "0.23.1"
sha2 = "0.11.1"

# NT3: construct an independent, affiliated page reviewer through Core facades.
bilibi-affiliation.workspace = true
bilibi-user.workspace = true

# NS1: the SST running proof (src/bin/sst.rs).
bilibi-finance-sst = { path = "../../sst" }

# H4: exercise the Settings checkout bound with the real operation handler.
bilibi-agent-api.workspace = true

# NC3: disposable browser proof of bank accounts, uploads and opening.
[[bin]]
name = "bilibi-finance-reconciliation-ui"
path = "src/bin/reconciliation-ui.rs"

# NT4: inspect the archive returned by the real Reports facade.
[dependencies.zip]
workspace = true

# NC4: disposable proof of the matching and reconciliation pages.
[[bin]]
name = "bilibi-finance-reconciliation-pages"
path = "src/bin/reconciliation-pages.rs"

# FY1: real delivered People events, then retained postings without People.
[[bin]]
name = "bilibi-finance-payroll-source"
path = "src/bin/payroll-source.rs"
