[package]
name = "bilibi-finance-einvoice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bilibi-audit.workspace = true
bilibi-authz.workspace = true
bilibi-company.workspace = true
bilibi-database.workspace = true
bilibi-integration.workspace = true
bilibi-module-registry.workspace = true
bilibi-party-ids.workspace = true
bilibi-queue.workspace = true
bilibi-settings.workspace = true
bilibi-tenancy.workspace = true
# The PUT method of a cancellation: Base Integration's `Outgoing` names
# methods by `http::Method` and has no `put` shorthand.
http = "1.5.0"
inventory.workspace = true
jiff = { version = "0.2.38", features = ["serde"] }
# The signature's base64 digests and certificate.
base64 = "0.23.1"
# Reads the company's signing certificate and RSA key (PEM) and signs with
# RSA PKCS#1 v1.5; `sha2` comes through rsa's feature because rsa 0.9 hashes
# with the digest crate generation it is built on (sha2 0.10), not the newer
# sha2 0.11.
rsa = { version = "0.9.10", features = ["sha2"] }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
x509-parser = "0.18.1"
